[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naturalistic-encoding-autism"
version = "0.1.0"
description = "Encoding models and feature pipelines for naturalistic fMRI (ASD / typical development)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jeff S. Mentch" }]

dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-learn>=1.0",
    "pandas>=1.4",
    "nibabel>=4.0",
    "h5py>=3.7",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "cvxopt>=1.3",
    "hcp-utils>=0.1",
    "nilearn>=0.10",
]

[project.optional-dependencies]
av = [
    "librosa>=0.10",
    "pyloudnorm>=0.1",
    "opencv-python>=4.5",
    "moten>=0.3.5",
]
dev = ["pytest>=7.0"]
full = ["librosa>=0.10", "pyloudnorm>=0.1", "opencv-python>=4.5", "moten>=0.3.5", "pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
